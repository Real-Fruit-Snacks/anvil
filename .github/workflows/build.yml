name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt required for: $out"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Cross-compile (linux)
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/anvil-linux-amd64 ./cmd/anvil

      - name: Cross-compile (windows)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/anvil-windows-amd64.exe ./cmd/anvil
